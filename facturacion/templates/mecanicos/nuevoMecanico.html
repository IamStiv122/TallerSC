{% extends "plantillaPrincipal.html" %}
{% block contenido %}
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <br>
                <h1><b>Registrar Nuevo Mecánico</b></h1>
                <hr>
                <form id="form_nuevo_mecanico" action="/mecanicos/guardar/" method="post">
                    {% csrf_token %}
                    <b>Usuario:</b> <br>
                    <input required class="form-control" type="text" name="username" placeholder="Ingrese el nombre de usuario">
                    <br>
                    <b>Contraseña:</b> <br>
                    <input required class="form-control" type="password" name="password" placeholder="Ingrese la contraseña">
                    <br>
                    <b>Nombre:</b> <br>
                    <input required class="form-control" type="text" name="nombre" placeholder="Ingrese el nombre">
                    <br>
                    <b>Apellido:</b> <br>
                    <input required class="form-control" type="text" name="apellido" placeholder="Ingrese el apellido">
                    <br>
                    <b>Email:</b> <br>
                    <input class="form-control" type="email" name="email" placeholder="Ingrese el email">
                    <br>
                    <b>Teléfono:</b> <br>
                    <input class="form-control" type="text" name="telefono" maxlength="10" placeholder="Ingrese el teléfono (opcional)">
                    <br>
                    <b>Especialidad:</b> <br>
                    <select class="form-control" name="especialidad">
                        {% for value,label in especialidades %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                    <br>
                    <button class="btn btn-success" type="submit">
                        <i class="fa fa-save"></i>
                        Guardar
                    </button>
                    <a href="/mecanicos/" class="btn btn-danger">
                        <i class="fa fa-times"></i>
                        Cancelar
                    </a>
                </form>
                <br>
                <br>
            </div>
        </div>
    </div>

{% endblock %}
{% block scripts %}
<script>
    $.validator.addMethod("telefonoCelularEc", function (value) {
        if (!value) return true;
        if (!/^\d{10}$/.test(value))     return false;
        if (!value.startsWith("09"))      return false;
        if (/^09(\d)\1{7}$/.test(value)) return false;
        return true;
    }, "Celular inválido: debe tener 10 dígitos, iniciar con 09 y no puede tener todos los dígitos iguales.");

    $.validator.addMethod("soloLetras", function (value) {
        return /^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s\-]+$/.test(value);
    }, "Este campo no puede contener números.");

    $('#form_nuevo_mecanico').validate({
        rules: {
            username: { required: true },
            password: { required: true, minlength: 6 },
            nombre:   { required: true, soloLetras: true },
            apellido: { required: true, soloLetras: true },
            telefono: { telefonoCelularEc: true }
        },
        messages: {
            username: { required: 'Ingrese el nombre de usuario' },
            password: { required: 'Ingrese la contraseña', minlength: 'Mínimo 6 caracteres' },
            nombre:   { required: 'Ingrese el nombre del mecánico',   soloLetras: 'El nombre no puede contener números.' },
            apellido: { required: 'Ingrese el apellido del mecánico', soloLetras: 'El apellido no puede contener números.' },
            telefono: { telefonoCelularEc: 'Celular inválido: debe tener 10 dígitos, iniciar con 09 y no puede tener todos los dígitos iguales.' }
        }
    });
</script>
{% endblock %}
